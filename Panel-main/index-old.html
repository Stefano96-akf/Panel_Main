<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PanLink Panel</title>

  <!-- Font e icone -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- Font Awesome (no integrity to avoid blocked loads) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar" role="banner">
    <div class="brand">
      <h1>PanLink Panel</h1>
      <p class="subtitle">Quick tools per clienti, link e note</p>
    </div>

    <div class="controls">
      <button id="dark-mode-toggle" aria-pressed="false" title="Attiva/Disattiva modalità notte">
        <span class="material-icons">dark_mode</span>
      </button>
    </div>
  </header>

  <main class="container" role="main">
    <!-- Pannello principale -->
    <section class="pannello" aria-labelledby="panel-clienti">
      <h2 id="panel-clienti">Clienti & Link</h2>

      <div class="form-group">
        <label for="filtro">Cerca cliente:</label>
        <input type="text" id="filtro" placeholder="Digita per cercare..." aria-label="Cerca cliente">
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="nome">Nome del Cliente:</label>
          <input type="text" id="nome" placeholder="Nome del cliente">
        </div>
        <div class="form-group">
          <label for="link">Link del Cliente:</label>
          <input type="url" id="link" placeholder="https://www.esempio.com">
        </div>
      </div>

      <button id="aggiungi">Aggiungi / Salva Cliente</button>

      <hr>

      <h3>Generatore Link Ente</h3>
      <div class="form-group">
        <label for="nomeEnte">Nome dell'Ente:</label>
        <input type="text" id="nomeEnte" placeholder="Es. Comune di Napoli">
      </div>

      <div class="row">
        <button id="generaLinkBtn" class="small">Genera Link Ente</button>
        <button id="copiaLinkBtn" class="small secondary" title="Copia link generato"><i class="fa-regular fa-clipboard"></i></button>
      </div>

      <div id="linkGeneratoContainer" class="generated" aria-live="polite">
        <p><strong>Link generato:</strong> <span id="linkGenerato" class="generated-link"></span></p>
      </div>

      <div class="lista-clienti" id="lista-clienti" aria-live="polite">
        <!-- I clienti verranno aggiunti qui -->
      </div>
      <div class="export-row" style="margin-top:12px; display:flex; gap:8px;">
        <button id="exportClientsCsv" class="small">Esporta Clienti (CSV)</button>
      </div>
    </section>

    <!-- Pannello laterale strumenti rapidi -->
    <aside class="pannello2" aria-labelledby="panel-tools">
      <h2 id="panel-tools">Strumenti</h2>

      <div class="tool-group">
        <button id="QueryDo">Apri Query Academy</button>
        <button id="CRUD">Apri CRUD Academy</button>
        </div>

        <div class="card appointments" aria-live="polite">
          <h3>Prossimi appuntamenti</h3>
          <div class="appt-form">
            <input type="date" id="appt-date">
            <input type="text" id="appt-desc" placeholder="Descrizione appuntamento">
            <select id="appt-type">
              <option value="remote">Da remoto</option>
              <option value="onsite">Onsite</option>
            </select>
            <button id="addAppt" class="small">Aggiungi Appuntamento</button>
          </div>
          <div class="appt-columns">
            <div>
              <h4>Da remoto</h4>
              <ul id="appt-remote" class="appt-list"></ul>
            </div>
            <div>
              <h4>Onsite</h4>
              <ul id="appt-onsite" class="appt-list"></ul>
            </div>
          </div>
        </div>
      </div>

      <label for="queryPreview">Anteprima Query</label>
      <textarea id="queryPreview" placeholder="Scrivi in anteprima la Query Select o CRUD..."></textarea>

      <div class="presets">
        <h4>Presets Rapidi</h4>
        <button class="preset" data-preset="Comune di Roma">Roma</button>
        <button class="preset" data-preset="Comune di Milano">Milano</button>
        <button class="preset" data-preset="Comune di Napoli">Napoli</button>
      </div>

      
    </aside>

    <!-- Pannello Note & Appunti -->
    <section class="pannello3" aria-labelledby="panel-notes">
      <h2 id="panel-notes">Note & Appunti</h2>

      <textarea id="noteInput" placeholder="Scrivi una nuova nota..."></textarea>
      <button id="aggiungiNota">Aggiungi Nota</button>

      <ul id="listaNote" class="note-list" aria-live="polite"></ul>

      <!-- Attività sotto-sezione -->
      <div class="attivita">
        <h3>Attività</h3>
        <div class="attivita-form">
          <input type="text" id="attivita-input" placeholder="Aggiungi una nuova attività...">
          <button id="addAttivita" class="small">Aggiungi</button>
        </div>
        <ul id="listaAttivita" class="attivita-list"></ul>
      </div>

      <div class="notes-export">
        <button id="exportNotesCsv" class="small secondary">Esporta Note (CSV)</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <!-- Generic edit modal -->
  <div id="editModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-header">
        <h3 id="modalTitle">Modifica</h3>
      </header>
      <div class="modal-body" id="modalBody">
        <!-- il contenuto viene inserito dinamicamente -->
      </div>
      <footer class="modal-footer">
        <button id="modalCancel" class="small secondary">Annulla</button>
        <button id="modalSave" class="small">Salva</button>
      </footer>
    </div>
  </div>
</body>
</html>
